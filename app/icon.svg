<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="statusGrad" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="beaconGlow" cx="32" cy="32" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#052e16" />
    </radialGradient>
    <filter id="liveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#22c55e" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="64" height="64" rx="16" fill="#050a07" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#statusGrad)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Outer Pulse Waves (Concentric Telemetry Rings) -->
  <circle cx="32" cy="32" r="22" stroke="#14532d" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="4 4" />
  <circle cx="32" cy="32" r="16" stroke="url(#statusGrad)" stroke-width="2" stroke-opacity="0.75" />

  <!-- Live Activity Beacon (Inner Glowing Core) -->
  <circle cx="32" cy="32" r="9" fill="url(#beaconGlow)" filter="url(#liveGlow)" />
  <circle cx="32" cy="32" r="4.5" fill="#ffffff" />

  <!-- Radar Sweep Horizon Accents -->
  <line x1="12" y1="32" x2="16" y2="32" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
  <line x1="48" y1="32" x2="52" y2="32" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="12" x2="32" y2="16" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="48" x2="32" y2="52" stroke="#22c55e" stroke-width="2" stroke-linecap="round" />
</svg>
